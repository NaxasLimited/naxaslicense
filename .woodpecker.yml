when:
  - event: [push, pull_request, manual]

steps:
  quality-and-tests:
    image: php:8.4-cli-bookworm
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git libicu-dev libzip-dev unzip
      - docker-php-ext-install -j"$(nproc)" intl pdo_sqlite zip
      - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
      - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
      - rm composer-setup.php
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - composer test

  build-assets:
    image: node:22-bookworm-slim
    commands:
      - npm ci --no-audit --no-fund
      - npm run build

  deploy-production:
    image: alpine:3.21
    environment:
      NAXAS_DEPLOY_HOST:
        from_secret: naxas_deploy_host
      NAXAS_DEPLOY_USER:
        from_secret: naxas_deploy_user
      NAXAS_DEPLOY_SSH_KEY:
        from_secret: naxas_deploy_ssh_key
      NAXAS_DEPLOY_KNOWN_HOSTS:
        from_secret: naxas_deploy_known_hosts
    commands:
      - apk add --no-cache openssh-client
      - install -d -m 0700 "$${HOME}/.ssh"
      - printf '%s\n' "$${NAXAS_DEPLOY_SSH_KEY}" > "$${HOME}/.ssh/id_ed25519"
      - printf '%s\n' "$${NAXAS_DEPLOY_KNOWN_HOSTS}" > "$${HOME}/.ssh/known_hosts"
      - chmod 0600 "$${HOME}/.ssh/id_ed25519" "$${HOME}/.ssh/known_hosts"
      - ssh -i "$${HOME}/.ssh/id_ed25519" -o IdentitiesOnly=yes "$${NAXAS_DEPLOY_USER}@$${NAXAS_DEPLOY_HOST}" "deploy $${CI_COMMIT_SHA}"
    when:
      - event: push
        branch: master
