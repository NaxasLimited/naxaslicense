when:
  - event: [push, pull_request, manual]

steps:
  quality-and-tests:
    image: php:8.4-cli-bookworm
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git libicu-dev libzip-dev unzip
      - docker-php-ext-install -j"$(nproc)" intl pdo_sqlite zip
      - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
      - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
      - rm composer-setup.php
      - composer install --no-interaction --prefer-dist
      - cp .env.example .env
      - composer test

  build-assets:
    image: node:22-bookworm-slim
    commands:
      - npm ci --no-audit --no-fund
      - npm run build

  deploy-production:
    image: curlimages/curl:8.12.1
    environment:
      DOKPLOY_DEPLOY_WEBHOOK:
        from_secret: dokploy_deploy_webhook
    commands:
      - test -n "$${DOKPLOY_DEPLOY_WEBHOOK}"
      - curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 -X POST "$${DOKPLOY_DEPLOY_WEBHOOK}"
    when:
      - event: push
        branch: master
